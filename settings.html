<div id="boxed-lllllabc-settings" class="boxed-lllllabc-settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <div class="boxed-lllllabc-header-title">
        <b>箱装辣白菜</b>
        <span
          id="boxed-lllllabc-update-hint"
          class="boxed-lllllabc-update-hint"
          aria-live="polite"
          hidden
        >有新版本可更新！</span>
      </div>
      <div class="boxed-lllllabc-header-side">
        <span id="boxed-lllllabc-settings-state" class="boxed-lllllabc-pill">未初始化</span>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
      </div>
    </div>

    <div class="inline-drawer-content">
      <div class="boxed-lllllabc-content">
        <section class="boxed-lllllabc-extension-meta" aria-label="扩展版本与信息">
          <div class="boxed-lllllabc-extension-meta-line">
            <div class="boxed-lllllabc-extension-meta-copy">
              <span id="boxed-lllllabc-version">Ver 0.1.4</span>
              <span class="boxed-lllllabc-meta-separator" aria-hidden="true"></span>
              <button
                id="boxed-lllllabc-info-toggle"
                class="boxed-lllllabc-meta-link"
                type="button"
                aria-haspopup="dialog"
              >扩展信息</button>
            </div>
            <div class="boxed-lllllabc-extension-meta-actions">
              <button
                id="boxed-lllllabc-update-available"
                class="menu_button boxed-lllllabc-meta-button boxed-lllllabc-update-button"
                type="button"
                hidden
              >
                <i class="fa-solid fa-download" aria-hidden="true"></i>
                <span>发现新版本</span>
              </button>
            </div>
          </div>
        </section>

        <label class="boxed-lllllabc-row">
          <span>
            <strong>启用本地备份</strong>
            <small>关闭后不会写入未保存变更、最近楼层备份，也不会核对酒馆保存状态。</small>
          </span>
          <input id="boxed-lllllabc-enabled" type="checkbox" />
        </label>

        <label class="boxed-lllllabc-row">
          <span>
            <strong>启用最近楼层备份</strong>
            <small>关闭后仍会保护未保存变更。</small>
          </span>
          <input id="boxed-lllllabc-recent-enabled" type="checkbox" />
        </label>

        <label class="boxed-lllllabc-row">
          <span>
            <strong>启用完整聊天备份</strong>
            <small>保存当前聊天从第 0 层到最新楼层的完整副本，只处理打开过的聊天。</small>
          </span>
          <input id="boxed-lllllabc-full-enabled" type="checkbox" />
        </label>

        <label class="boxed-lllllabc-row">
          <span>
            <strong>启用历史楼层改动备份</strong>
            <small>保护最近备份范围以外的楼层改动，后端确认后仍会保留。</small>
          </span>
          <input id="boxed-lllllabc-historical-enabled" type="checkbox" />
        </label>

        <label class="boxed-lllllabc-row">
          <span>
            <strong>最近备份层数</strong>
            <small>只影响最近楼层备份，不影响未保存变更保护。</small>
          </span>
          <input id="boxed-lllllabc-recent-limit" type="number" min="1" max="200" step="1" />
        </label>

        <label class="boxed-lllllabc-row">
          <span>
            <strong>状态显示位置</strong>
            <small>默认位于最新楼层内部最下方；顶部模式会浮在聊天区上方，楼层仍可从下方滚动。</small>
          </span>
          <select id="boxed-lllllabc-status-display-mode">
            <option value="message">最新楼层内部</option>
            <option value="top">聊天区顶部</option>
          </select>
        </label>

        <label class="boxed-lllllabc-row">
          <span>
            <strong>楼层状态灯居中</strong>
            <small>关闭时靠左，开启时居中；只影响最新楼层内部。</small>
          </span>
          <span class="boxed-lllllabc-switch-control">
            <input
              id="boxed-lllllabc-status-message-centered"
              class="boxed-lllllabc-switch-input"
              type="checkbox"
              role="switch"
            />
            <span class="boxed-lllllabc-switch-track" aria-hidden="true"></span>
          </span>
        </label>

        <section class="boxed-lllllabc-storage-mode" aria-label="存储方式与状态">
          <strong>存储方式与状态</strong>
          <p>当前活动端：<span id="boxed-lllllabc-storage-mode">正在读取</span></p>
          <p id="boxed-lllllabc-sqlite-state">正在检查可选后端</p>
          <button id="boxed-lllllabc-check-storage" class="menu_button" type="button">检查连接</button>
          <button id="boxed-lllllabc-switch-storage" class="menu_button" type="button" disabled>切换存储方式</button>
          <button id="boxed-lllllabc-clear-inactive" class="menu_button" type="button" disabled>清空旧端数据</button>
          <p id="boxed-lllllabc-transfer-result" role="status"></p>
        </section>
        <section class="boxed-lllllabc-storage-overview" aria-labelledby="boxed-lllllabc-storage-title">
          <div class="boxed-lllllabc-storage-heading">
            <strong id="boxed-lllllabc-storage-title">本地存储</strong>
            <span id="boxed-lllllabc-storage-state" data-tone="unavailable">正在读取</span>
          </div>
          <p id="boxed-lllllabc-storage-help" class="boxed-lllllabc-storage-help">备份只保存在当前酒馆地址；各项统计方式不同，数值可能不完全对应。</p>
          <dl class="boxed-lllllabc-storage-metrics">
            <div><dt>备份内容大小（估算）</dt><dd id="boxed-lllllabc-storage-extension">正在计算</dd></div>
            <div><dt id="boxed-lllllabc-storage-site-label">当前酒馆已使用</dt><dd id="boxed-lllllabc-storage-site">正在读取</dd></div>
            <div><dt id="boxed-lllllabc-storage-remaining-label">当前酒馆还可使用</dt><dd id="boxed-lllllabc-storage-remaining">正在读取</dd></div>
          </dl>
          <p id="boxed-lllllabc-storage-issue" class="boxed-lllllabc-storage-issue" hidden></p>
        </section>

        <section aria-label="聊天快照">
          <strong>聊天快照</strong>
          <p>手动保存完整聊天，存档内容独立保留。</p>
          <button id="boxed-lllllabc-manage-snapshots" class="menu_button boxed-lllllabc-action-button" type="button">管理聊天快照</button>
        </section>
        <div class="boxed-lllllabc-actions">
          <button id="boxed-lllllabc-refresh" class="menu_button boxed-lllllabc-action-button" type="button">
            <i class="fa-solid fa-rotate" aria-hidden="true"></i>
            <span data-boxed-lllllabc-button-label>立即核对后端</span>
          </button>
          <button id="boxed-lllllabc-toggle-panel" class="menu_button boxed-lllllabc-action-button" type="button">
            <i class="fa-solid fa-box-archive" aria-hidden="true"></i>
            <span data-boxed-lllllabc-button-label>查看当前聊天备份</span>
          </button>
          <button id="boxed-lllllabc-open-catalog" class="menu_button boxed-lllllabc-action-button" type="button">
            <i class="fa-solid fa-boxes-stacked" aria-hidden="true"></i>
            <span>查看全部聊天备份</span>
          </button>
        </div>

        <div id="boxed-lllllabc-settings-panel" class="boxed-lllllabc-panel" hidden>
          <div class="boxed-lllllabc-panel-title">当前聊天备份</div>
          <div id="boxed-lllllabc-settings-panel-body" class="boxed-lllllabc-panel-body">暂无数据。</div>
        </div>
      </div>
    </div>
  </div>
</div>
